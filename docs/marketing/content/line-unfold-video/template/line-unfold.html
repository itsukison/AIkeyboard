<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
  <title>LINE unfold</title>
  <style>
    :root {
      --line-blue: #8faed2;
      --line-green: #84e26f;
      --incoming: #fff;
      --ink: #171717;
      --meta: rgba(255, 255, 255, .78);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #15191e;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      -webkit-font-smoothing: antialiased;
      font-feature-settings: "palt" 1;
    }

    .canvas {
      position: fixed;
      left: 50%;
      top: 50%;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      transform: translate(-50%, -50%) scale(var(--canvas-scale, 1));
      transform-origin: center;
      background: var(--line-blue);
    }

    .conversation {
      position: absolute;
      top: 278px;
      left: 0;
      right: 0;
      bottom: 158px;
      overflow: hidden;
    }

    .message {
      margin-bottom: 18px;
      display: flex;
      align-items: flex-end;
      padding: 0 136px;
    }

    .message.me { justify-content: flex-end; }
    .message.other { justify-content: flex-start; }

    .bubble {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      min-width: 92px;
      min-height: 88px;
      width: fit-content;
      max-width: 620px;
      padding: 17px 28px 18px;
      border-radius: 31px;
      background: var(--incoming);
      font-size: 36px;
      line-height: 1.42;
      font-weight: 480;
      letter-spacing: -.025em;
      white-space: pre;
    }

    .me .bubble { background: var(--line-green); }
    .bubble.blank { color: transparent; }

    .image-bubble {
      flex: 0 0 auto;
      overflow: hidden;
      border-radius: 31px;
      background: var(--line-green);
    }

    .image-bubble img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .image-bubble.blank img { visibility: hidden; }

    .meta {
      display: flex;
      flex-direction: column;
      flex: 0 0 auto;
      margin-bottom: 8px;
      color: var(--meta);
      font-size: 20px;
      line-height: 1.12;
      font-weight: 550;
      text-shadow: 0 1px 3px rgba(47, 72, 107, .25);
    }

    .other .meta { margin-left: 14px; }
    .me .meta { order: -1; margin-right: 14px; align-items: flex-end; }
    .meta:empty { display: none; }
  </style>
</head>
<body>
  <main class="canvas">
    <section class="conversation" id="conversation"></section>
  </main>

  <script>
    const params = new URLSearchParams(location.search);
    const spec = JSON.parse(params.get("spec"));
    const pages = spec.pages || [{ messages: spec.messages }];
    const pageIndex = Math.max(0, Math.min(pages.length - 1, Number(params.get("page") || 0)));
    const messages = pages[pageIndex].messages;
    const step = Math.max(0, Math.min(messages.length, Number(params.get("step") || 0)));
    const canvas = document.querySelector(".canvas");

    function fitCanvas() {
      canvas.style.setProperty("--canvas-scale", Math.min(innerWidth / 1080, innerHeight / 1920));
    }

    const conversation = document.getElementById("conversation");
    messages.forEach((message, index) => {
      const revealed = index < step;
      const row = document.createElement("div");
      row.className = `message ${message.side}`;

      let bubble;
      if (message.type === "image") {
        bubble = document.createElement("div");
        bubble.className = `image-bubble${revealed ? "" : " blank"}`;
        bubble.style.width = `${message.width}px`;
        bubble.style.height = `${message.height}px`;
        const image = document.createElement("img");
        image.src = message.src;
        image.alt = "";
        bubble.appendChild(image);
      } else {
        bubble = document.createElement("div");
        bubble.className = `bubble${revealed ? "" : " blank"}`;
        bubble.textContent = message.text;
      }

      const meta = document.createElement("div");
      meta.className = "meta";
      if (revealed) {
        if (message.read) {
          const read = document.createElement("span");
          read.textContent = message.read;
          meta.appendChild(read);
        }
        const time = document.createElement("span");
        time.textContent = message.time;
        meta.appendChild(time);
      }

      row.append(bubble, meta);
      conversation.appendChild(row);
    });

    fitCanvas();
    addEventListener("resize", fitCanvas);
  </script>
</body>
</html>
