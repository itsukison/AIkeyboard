<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>上司の「今日中にいける？」を勘違いした新卒</title>
  <style>
    :root {
      --ink: #1f1b29;
      --muted: #746d80;
      --purple: #7455e9;
      --purple-dark: #4a32ad;
      --lavender: #eee9ff;
      --lavender-2: #ddd3ff;
      --paper: #fbf9ff;
      --boss: #ffffff;
      --employee: #7354e8;
      --danger: #ef5b62;
      --success: #3c9974;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: var(--paper);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      font-feature-settings: "palt" 1;
    }

    body {
      --pad-x: 78px;
      --pad-top: 104px;
      --pad-bottom: 86px;
      --title: 80px;
      --headline: 64px;
      --body: 48px;
      --small: 30px;
    }

    body.instagram {
      --pad-x: 72px;
      --pad-top: 60px;
      --pad-bottom: 52px;
      --title: 66px;
      --headline: 54px;
      --body: 39px;
      --small: 25px;
    }

    #slide {
      position: relative;
      width: 100%;
      height: 100%;
      padding: var(--pad-top) var(--pad-x) var(--pad-bottom);
      display: flex;
      flex-direction: column;
      isolation: isolate;
      background:
        radial-gradient(circle at 88% 12%, rgba(181, 159, 255, .48), transparent 25%),
        radial-gradient(circle at 8% 82%, rgba(255, 208, 230, .38), transparent 28%),
        linear-gradient(155deg, #fbfaff 0%, #f0ecff 52%, #e7e1ff 100%);
    }

    #slide::before {
      content: "";
      position: absolute;
      inset: 22px;
      border: 2px solid rgba(92, 69, 176, .12);
      border-radius: 42px;
      pointer-events: none;
      z-index: -1;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      align-self: flex-start;
      min-height: 58px;
      padding: 10px 24px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .8);
      border: 2px solid rgba(87, 62, 174, .12);
      box-shadow: 0 12px 30px rgba(66, 44, 140, .08);
      color: var(--purple-dark);
      font-size: var(--small);
      font-weight: 800;
      letter-spacing: .04em;
      flex: 0 0 auto;
    }

    .title {
      margin: 34px 0 0;
      font-size: var(--title);
      line-height: 1.2;
      letter-spacing: -.035em;
      font-weight: 950;
    }

    .title em {
      color: var(--purple-dark);
      font-style: normal;
      background: linear-gradient(transparent 66%, rgba(255, 220, 91, .85) 0);
    }

    .subtitle {
      margin: 26px 0 0;
      color: var(--muted);
      font-size: var(--body);
      line-height: 1.5;
      font-weight: 700;
    }

    .swipe {
      margin-top: auto;
      align-self: center;
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 16px 26px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .7);
      color: var(--purple-dark);
      font-size: var(--small);
      font-weight: 850;
    }

    .preview-card {
      margin-top: 76px;
      padding: 44px;
      border-radius: 42px;
      background: rgba(255, 255, 255, .86);
      border: 3px solid rgba(102, 78, 192, .11);
      box-shadow: 0 34px 80px rgba(72, 48, 153, .13);
      transform: rotate(-1.25deg);
    }

    body.instagram .preview-card { margin-top: 34px; padding: 34px; }

    .preview-label {
      color: var(--muted);
      font-size: var(--small);
      font-weight: 750;
      margin-bottom: 22px;
    }

    .preview-message {
      display: inline-block;
      padding: 25px 30px;
      border-radius: 30px 30px 30px 8px;
      background: var(--boss);
      border: 2px solid #e6e1ef;
      font-size: var(--body);
      line-height: 1.35;
      font-weight: 850;
    }

    .chat-shell {
      flex: 1;
      min-height: 0;
      margin-top: 34px;
      border-radius: 48px;
      overflow: hidden;
      background: rgba(236, 241, 250, .94);
      border: 3px solid rgba(65, 47, 130, .11);
      box-shadow: 0 35px 90px rgba(67, 45, 145, .14);
      display: flex;
      flex-direction: column;
    }

    body.instagram .chat-shell { margin-top: 24px; border-radius: 38px; }

    .chat-header {
      min-height: 154px;
      padding: 24px 34px;
      display: flex;
      align-items: center;
      gap: 24px;
      background: rgba(255, 255, 255, .92);
      border-bottom: 2px solid rgba(52, 41, 93, .08);
    }

    body.instagram .chat-header { min-height: 112px; padding: 17px 28px; }

    .avatar {
      width: 86px;
      height: 86px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      background: linear-gradient(145deg, #4d3b9d, #261c58);
      color: white;
      font-size: 36px;
      font-weight: 900;
      box-shadow: 0 12px 24px rgba(44, 29, 105, .2);
    }

    body.instagram .avatar { width: 68px; height: 68px; font-size: 30px; }

    .chat-name { font-size: 41px; font-weight: 900; }
    body.instagram .chat-name { font-size: 34px; }
    .chat-status { margin-top: 4px; color: var(--success); font-size: 25px; font-weight: 750; }
    body.instagram .chat-status { font-size: 20px; }

    .chat-body {
      flex: 1;
      padding: 52px 40px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 30px;
    }

    body.instagram .chat-body { padding: 30px 34px; gap: 18px; }

    .row { display: flex; align-items: flex-end; gap: 16px; }
    .row.me { justify-content: flex-end; }

    .mini-avatar {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      background: #3a2c7a;
      color: white;
      font-size: 25px;
      font-weight: 900;
    }

    body.instagram .mini-avatar { width: 46px; height: 46px; font-size: 21px; }

    .bubble {
      max-width: 76%;
      padding: 26px 31px;
      border-radius: 32px 32px 32px 8px;
      background: var(--boss);
      color: var(--ink);
      border: 2px solid rgba(46, 36, 74, .08);
      box-shadow: 0 12px 24px rgba(52, 40, 90, .06);
      font-size: var(--body);
      font-weight: 720;
      line-height: 1.45;
    }

    .me .bubble {
      border-radius: 32px 32px 8px 32px;
      background: var(--employee);
      color: white;
      border: none;
    }

    body.instagram .bubble { padding: 20px 25px; border-radius: 26px 26px 26px 7px; }
    body.instagram .me .bubble { border-radius: 26px 26px 7px 26px; }

    .time {
      margin: 8px 4px 0;
      color: #8d8798;
      font-size: 23px;
      font-weight: 650;
    }

    body.instagram .time { font-size: 18px; }

    .message-wrap.me { display: flex; flex-direction: column; align-items: flex-end; }

    .reaction {
      text-align: center;
      margin-top: 22px;
      color: var(--purple-dark);
      font-size: var(--headline);
      line-height: 1.25;
      font-weight: 950;
      flex: 0 0 auto;
    }

    body.instagram .reaction { margin-top: 12px; }

    .section-title {
      font-size: var(--headline);
      line-height: 1.26;
      font-weight: 950;
      letter-spacing: -.025em;
      margin: 24px 0 0;
    }

    .draft-card, .rewrite-card {
      margin-top: 60px;
      padding: 48px;
      border-radius: 40px;
      background: rgba(255, 255, 255, .88);
      border: 3px solid rgba(72, 52, 141, .1);
      box-shadow: 0 32px 80px rgba(65, 42, 145, .12);
    }

    body.instagram .draft-card,
    body.instagram .rewrite-card { margin-top: 28px; padding: 34px; border-radius: 34px; }

    .card-label {
      display: inline-flex;
      padding: 9px 18px;
      border-radius: 999px;
      color: white;
      background: var(--danger);
      font-size: var(--small);
      font-weight: 900;
    }

    .card-label.good { background: var(--success); }

    .draft-text, .result-text {
      margin-top: 32px;
      font-size: 59px;
      line-height: 1.55;
      font-weight: 900;
      letter-spacing: -.02em;
      overflow-wrap: anywhere;
    }

    body.instagram .draft-text,
    body.instagram .result-text { margin-top: 20px; font-size: 45px; line-height: 1.45; }

    .note {
      margin-top: 34px;
      padding: 24px 26px;
      border-radius: 24px;
      background: #fff1f1;
      color: #a73c43;
      font-size: 36px;
      font-weight: 800;
      line-height: 1.45;
    }

    body.instagram .note { margin-top: 20px; padding: 18px 22px; font-size: 29px; }

    .transform {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      margin: 35px 0 -20px;
      color: var(--purple-dark);
      font-size: 34px;
      font-weight: 900;
    }

    body.instagram .transform { margin: 20px 0 -12px; font-size: 27px; }

    .transform::before, .transform::after {
      content: "";
      width: 86px;
      height: 2px;
      background: rgba(74, 50, 173, .25);
    }

    .why {
      margin-top: 34px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .why span {
      padding: 20px 18px;
      border-radius: 22px;
      text-align: center;
      background: rgba(116, 85, 233, .1);
      color: var(--purple-dark);
      font-size: 29px;
      font-weight: 850;
    }

    body.instagram .why { margin-top: 21px; }
    body.instagram .why span { padding: 14px; font-size: 23px; }

    .rewrite-slide .section-title { font-size: 58px; }
    .rewrite-slide .rewrite-card { margin-top: 34px; padding: 40px; }
    .rewrite-slide .result-text { margin-top: 24px; font-size: 49px; line-height: 1.42; }
    .rewrite-slide .why { margin-top: 24px; }
    body.instagram .rewrite-slide .section-title { font-size: 44px; }
    body.instagram .rewrite-slide .rewrite-card { margin-top: 20px; padding: 28px; }
    body.instagram .rewrite-slide .result-text { margin-top: 16px; font-size: 34px; line-height: 1.38; }
    body.instagram .rewrite-slide .why { margin-top: 16px; }
    body.instagram .rewrite-slide .why span { padding: 11px; font-size: 21px; }

    .brand-slide {
      justify-content: center;
      align-items: center;
      text-align: center;
      background:
        radial-gradient(circle at 50% 28%, rgba(255, 255, 255, .92), transparent 30%),
        radial-gradient(circle at 8% 88%, rgba(255, 198, 229, .38), transparent 28%),
        linear-gradient(155deg, #f9f7ff 0%, #e8e1ff 48%, #cfc1ff 100%) !important;
    }

    .app-icon {
      width: 430px;
      height: 430px;
      object-fit: contain;
      filter: drop-shadow(0 34px 46px rgba(76, 48, 150, .24));
    }

    body.instagram .app-icon { width: 285px; height: 285px; }

    .brand-title {
      margin: 52px 0 0;
      font-size: 78px;
      line-height: 1.2;
      font-weight: 950;
      letter-spacing: -.035em;
    }

    body.instagram .brand-title { margin-top: 28px; font-size: 60px; }

    .brand-subtitle {
      margin-top: 24px;
      color: var(--purple-dark);
      font-size: 46px;
      line-height: 1.5;
      font-weight: 850;
    }

    body.instagram .brand-subtitle { margin-top: 14px; font-size: 34px; }

    .brand-name {
      margin-top: 52px;
      padding: 19px 34px;
      border-radius: 999px;
      background: rgba(255, 255, 255, .78);
      border: 2px solid rgba(75, 49, 166, .14);
      color: var(--purple-dark);
      font-size: 34px;
      font-weight: 900;
      letter-spacing: .03em;
    }

    body.instagram .brand-name { margin-top: 28px; padding: 14px 26px; font-size: 26px; }

    .comment-cta {
      margin-top: 70px;
      max-width: 820px;
      padding-top: 38px;
      border-top: 2px solid rgba(74, 50, 173, .18);
      color: #4a4258;
      font-size: 36px;
      line-height: 1.5;
      font-weight: 780;
    }

    body.instagram .comment-cta { margin-top: 34px; padding-top: 22px; font-size: 28px; }

    .footer {
      position: absolute;
      left: var(--pad-x);
      right: var(--pad-x);
      bottom: 42px;
      display: flex;
      justify-content: space-between;
      color: rgba(47, 36, 78, .55);
      font-size: 24px;
      font-weight: 750;
      letter-spacing: .04em;
    }

    body.instagram .footer { bottom: 28px; font-size: 19px; }
    .brand-slide .footer { justify-content: center; }
  </style>
</head>
<body>
  <main id="slide"></main>
  <script>
    const params = new URLSearchParams(location.search);
    const slideNumber = Math.min(7, Math.max(1, Number(params.get("slide")) || 1));
    const format = params.get("format") === "instagram" ? "instagram" : "tiktok";
    document.body.classList.add(format);

    const footer = (n) => `<div class="footer"><span>@keigobutton</span><span>${n} / 7</span></div>`;
    const chat = (messages, reaction = "") => `
      <div class="eyebrow">新卒ゆなの職場チャット｜フィクション</div>
      <section class="chat-shell">
        <header class="chat-header">
          <div class="avatar">上</div>
          <div><div class="chat-name">上司</div><div class="chat-status">● オンライン</div></div>
        </header>
        <div class="chat-body">
          ${messages.map((message) => message.me ? `
            <div class="row me"><div class="message-wrap me"><div class="bubble">${message.text}</div><div class="time">既読 ${message.time}</div></div></div>
          ` : `
            <div class="row"><div class="mini-avatar">上</div><div><div class="bubble">${message.text}</div><div class="time">${message.time}</div></div></div>
          `).join("")}
        </div>
      </section>
      ${reaction ? `<div class="reaction">${reaction}</div>` : ""}
    `;

    const slides = [
      `
        <div class="eyebrow">上司チャットあるある｜フィクション</div>
        <h1 class="title">上司の<br><em>「今日中にいける？」</em>を<br>勘違いした新卒</h1>
        <p class="subtitle">最後の返信、あなたなら何て送る？</p>
        <div class="preview-card">
          <div class="preview-label">上司　16:42</div>
          <div class="preview-message">今日中にいけそう？</div>
        </div>
        <div class="swipe">会話を見る　→</div>
        ${footer(1)}
      `,
      `
        ${chat([
          { text: "今日中にいけそう？", time: "16:42" },
          { text: "正直、厳しいです…", time: "16:43", me: true }
        ])}
        ${footer(2)}
      `,
      `
        ${chat([
          { text: "どこまでならいける？", time: "16:44" },
          { text: "最寄駅までなら<br>いけます", time: "16:44", me: true }
        ])}
        ${footer(3)}
      `,
      `
        ${chat([
          { text: "仕事の進捗の話です", time: "16:45" },
          { text: "……", time: "16:45", me: true }
        ], "終わった。")}
        ${footer(4)}
      `,
      `
        <div class="eyebrow">このあと、何て返す？</div>
        <h2 class="section-title">正直に書くと、こうなる。</h2>
        <section class="draft-card">
          <div class="card-label">送信前の文章</div>
          <div class="draft-text">本日中は無理です。<br>明日やります。</div>
          <div class="note">伝わるけれど、少し冷たく聞こえるかも。</div>
        </section>
        <div class="swipe">敬語にすると　→</div>
        ${footer(5)}
      `,
      `
        <div class="eyebrow">敬語ボタンなら</div>
        <h2 class="section-title">断りながら、<br>次の予定まで伝える。</h2>
        <div class="transform">タップで変換</div>
        <section class="rewrite-card">
          <div class="card-label good">送れる返信</div>
          <div class="result-text">申し訳ありません。<br>本日中の完了が難しいため、<br>明日午前までお時間を<br>いただけますでしょうか。</div>
          <div class="why"><span>謝意を伝える</span><span>期限を提案する</span></div>
        </section>
        ${footer(6)}
      `,
      `
        <img class="app-icon" src="../../../../../assets/marketing/iconbgremoved.png" alt="敬語ボタンのアプリアイコン">
        <h2 class="brand-title">送信前の3秒で、<br>ちゃんと伝わる。</h2>
        <div class="brand-subtitle">文章を選んで、タップで敬語に。</div>
        <div class="brand-name">AIキーボード「敬語ボタン」</div>
        <div class="comment-cta">返しづらかった上司チャットを<br>コメントで教えてください。次回、敬語にします。</div>
        <div class="footer"><span>@keigobutton</span></div>
      `
    ];

    const root = document.querySelector("#slide");
    root.innerHTML = slides[slideNumber - 1];
    if (slideNumber === 6) root.classList.add("rewrite-slide");
    if (slideNumber === 7) root.classList.add("brand-slide");
  </script>
</body>
</html>
